schema_version: 1
id: personal-crm
name: Personal CRM
command:
- personal-data-hub
public_url: https://crm-home.172906573.xyz
port: 8080
host_port: 18086
bind_address: 192.168.31.201
compose_project: mcp
compose_service: crm
volumes:
- name: personal-crm_crm-data
  mount: /data
  external: true
- name: personal-data-hub-assets
  mount: /hub-assets
  external: true
bind_mounts:
- source: /home/yuwk/.config/personal-data-hub/container
  mount: /run/hub
  read_only: true
environment:
  HOST: 0.0.0.0
  PORT: '8080'
  OAUTH_STORAGE_PATH: /data/oauth
  MCP_DEVELOPMENT_NO_AUTH: 'false'
  DAILY_REVIEW_EVENTS_ENABLED: 'false'
  HUB_CONFIG: /run/hub/config.json
  CHAT_EVENTS_ENABLED: 'true'
  CRM_ASSET_ROOT: /hub-assets
  WECHAT_INTERACTION_GAP_MINUTES: '30'
required_env:
- DATABASE_URL
- WECHAT_WEBHOOK_SECRET
- OIDC_CLIENT_SECRET
- OAUTH_JWT_SIGNING_KEY
- OAUTH_STORAGE_ENCRYPTION_KEY
- OIDC_AUTHORIZED_USERNAMES
auth:
  client_id: personal-crm
  discovery_url: https://authelia-home.172906573.xyz/.well-known/openid-configuration
backup_command:
- hub
- backup
- --destination
- '{backup_path}'
integrity_command:
- hub
- status
plugin:
  name: personal-crm
  version: 2.0.0
  description: 统一读取个人信息归档：联系人和微信互动、Codex Computer History、Plaud 录音与转录文字、融合日报和每日摘要、财务、健康、Hermes 执行报告、日历、任务、邮件、Git、Memos、Mem0 和用量数据。CRM 支持人物和交互读写，其他来源查询只读。
  display_name: CRM
  app_id: asdk_app_6ac28369423081918d34fa531d15a62d
  app_binding: dev-6ac28369423081918d34fa531d15a62d
  logo: apps/crm/assets/plugin/logo-c.png
  keywords:
  - CRM
  - 联系人
  - 关系管理
  - 交互历史
  short_description: 维护人物资料与交互历史，查询个人信息归档
  brand_color: '#5953C8'
external_networks:
- data_net
deployment_mode: existing
cap_drop:
- ALL
security_opt:
- no-new-privileges:true
user: 1000:1001
migration_command:
- personal-crm
- migrate
container_name: personal-crm-crm-1
