schema_version: 1
id: personal-crm
name: Personal CRM
command:
- personal-crm-server
public_url: https://crm-home.172906573.xyz
port: 8080
host_port: 18086
bind_address: 192.168.31.201
compose_project: personal-crm
compose_service: crm
volumes:
- name: personal-crm_crm-data
  mount: /data
  external: true
bind_mounts:
- source: /vol2/1000/Docker/personal-review/data/derived/skysight/source-summaries
  mount: /sources/codex-skylight
  read_only: true
- source: /vol2/1000/Docker/memos/data
  mount: /sources/memos
  read_only: true
environment:
  HOST: 0.0.0.0
  PORT: '8080'
  OAUTH_STORAGE_PATH: /data/oauth
  MCP_DEVELOPMENT_NO_AUTH: 'false'
  CODEX_SKYLIGHT_PATH: /sources/codex-skylight
  MEMOS_DATABASE_PATH: /sources/memos/memos_prod.db
  MEMOS_CREATOR_ID: '1'
  DAILY_REVIEW_EVENTS_ENABLED: 'true'
  DAILY_REVIEW_EVENT_OWNER: yuwk
  DAILY_REVIEW_EVENT_STORAGE_PATH: /data/events/daily-reviews
  DAILY_REVIEW_EVENT_TIMEZONE: Asia/Shanghai
  DAILY_REVIEW_EVENT_TIME: '23:00'
required_env:
- DATABASE_URL
- WECHAT_WEBHOOK_SECRET
- OIDC_CLIENT_SECRET
- OAUTH_JWT_SIGNING_KEY
- OAUTH_STORAGE_ENCRYPTION_KEY
- OIDC_AUTHORIZED_USERNAMES
auth:
  client_id: personal-crm
  discovery_url: https://authelia-home.172906573.xyz/.well-known/openid-configuration
backup_command:
- python
- -c
- import os,sqlite3;p=os.environ['DATABASE_URL'];assert p.startswith('sqlite:///');a=sqlite3.connect(p[len('sqlite:///'):]);b=sqlite3.connect('{backup_path}');a.backup(b);b.close();a.close()
integrity_command:
- personal-crm
- integrity
plugin:
  name: personal-crm
  version: 1.1.2
  description: 管理个人联系人和人际关系：查找朋友、同事、客户、HR 与猎头，查看人物档案、近期互动摘要、重要事实和待跟进事项。支持新增或更新联系人、记录交流与人物事实、安排和管理跟进提醒，并汇总每周关系维护情况。可按日期读取已同步的微信聊天记录与摘要，帮助回顾上次聊了什么、记住对方的变化并安排下一次联系。
  display_name: CRM
  app_id: asdk_app_6ac28369423081918d34fa531d15a62d
  app_binding: dev-6ac28369423081918d34fa531d15a62d
  logo: assets/plugin/logo-c.png
  keywords:
  - CRM
  - 联系人
  - 关系管理
  - 微信摘要
  - HR
  - 猎头
  - 跟进
  - 提醒
  short_description: 管理联系人、互动摘要、人物事实与跟进提醒
  brand_color: '#5953C8'
