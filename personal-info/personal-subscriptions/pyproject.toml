[project]
name = "personal-subscriptions"
version = "0.1.0"
description = "Independent account subscriptions and latest AI/network quotas"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp-platform"]

[project.scripts]
personal-subscriptions = "personal_subscriptions.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_subscriptions"]

[tool.uv.sources]
mcp-platform = { git = "https://github.com/ump45nose/mcp-platform.git", rev = "dea309a5d83b6365a57937bc6e11affe692bfcaf" }
