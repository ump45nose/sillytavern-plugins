schema_version: 1

sources:
  skysight: true
  memos: true
  email: true
  health: true
  finance: true
  git: true
  crm: true
  mem0: false
  google_tasks: true
  google_calendar: true
  email_accounts: [gmail1, gmail2, qq, wecom]
  email_body_budget: 12
  email_filter:
    useful_patterns: ["面试", "简历通过", "录用", "job offer", "interview", "合同", "签约", "contract", "发票", "invoice", "付款", "收款", "退款", "payment", "审批通过", "审批拒绝", "审核通过", "审核未通过", "申请结果", "评审结果", "直接回复", "回复：", "re:", "交付失败", "部署失败", "payment failed"]
    automated_allow_patterns: ["面试", "简历通过", "录用", "job offer", "interview", "合同", "签约", "contract", "发票", "invoice", "付款", "收款", "退款", "payment", "审批通过", "审批拒绝", "审核通过", "审核未通过", "申请结果", "评审结果"]
    automated_sender_patterns: ["noreply", "no-reply", "donotreply", "do-not-reply", "notice@", "notification@"]
    sensitive_patterns: ["验证码", "安全码", "verification code", "security code", "one-time code", "one time code", "otp", "密码重置", "reset password", "新设备登录", "new device login", "verify your profile", "验证你的帐户", "验证你的账号"]
    noise_patterns: ["私信", "newsletter", "unsubscribe", "每日摘要", "每周摘要", "促销", "优惠", "广告", "instagram", "facebook", "linux.do"]
    blocker_patterns: ["失败", "拒绝", "未通过", "failed", "rejected", "declined"]
  google_calendar_max_results: 250
  google_tasks_max_results: 100
  aggregation:
    github_sender_patterns: ["github.com"]
    github_subject_patterns: ["pull request", "pr #", "issue #"]
    github_max_subjects: 4
    google_tasks_max_titles: 6
  priority: [memos, skysight, email, google_calendar, google_tasks, crm, git, finance, health, mem0]

evidence:
  admitted_kinds: [delivery, decision, blocker, external_feedback, relationship, health_change, finance_change, git_activity]
  excluded_patterns:
    - "Hermes 运行"
    - "cron 执行"
    - "tool call"
    - "预算保护"
  dedupe_window_minutes: 180

daily:
  cutoff: "21:30"
  skysight_cutoff: "21:00"
  draft_expiry_hours: 27
  max_unresolved: 2
  summary_max_chars: 45
  summary_max_list_separators: 1
  moment_min_chars: 6
  moment_forbidden_patterns: [有空, 以后, 再看, 计划, 准备, 待办, 下一步]
  moment_scene_patterns: [看到, 听到, 闻到, 摸到, 站在, 坐在, 走到, 走出, 抬头, 回头, 镜头, 屏幕, 窗, 路, 山, 云, 光, 雨, 风, 人, 手, 眼前, 那一刻]
  comment_max_chars: 300
  research_topics: 1
  action_options: 3
  guidance:
    context_sources: [candidate_facts, user_profile]
    question_targets: [tradeoff, validation, stop_condition]
    action_targets: [current_goal, concrete_next_step, resource_allocation]
    focus_policy: primary_storyline
    action_option_mode: alternative_resource_decisions
    excluded_action_domains: [personal_review_operations]
    forbid_review_procedure: true
    respect_operational_gates: true
  final_edit:
    mode: light_compression
    preserve: [facts, first_person_voice, uncertainty]
    remove: [repetition, filler, meta_instructions]
    semantic_change_requires_reconfirmation: true
  emotion_words: [愉快, 满足, 期待, 平静, 疲惫, 焦虑, 烦躁, 低落, 愤怒, 委屈, 孤独, 麻木]
  fields: [情绪, 健康, 财务, 留痕, 未解, 明天唯一重点, 瞬间]

weekly:
  schedule: "SUN 21:50"
  expiry: next_weekly_run
  repetition_threshold: 3
  fields: [可验证变化, 重复模式, 沉淀, 状态, 阶段性目标, 下周资源分配, 决定日志]

stages:
  mainline_domain: 总主线
  domains: [关系, 身体, 财务, 生活, 事业]
  cycle_days: 42
  max_active_goals: 5
  preclose_days: 1
  missing_close_policy: freeze
  allowed_terminal_states: [成功, 失败, 停止]

retention:
  skysight_raw_days: 90
  attachment_pending_days: 30
  quarantine_days: 7
  derived_until_annual: true

projections:
  retry_max: 5
  retry_backoff_minutes: 30

attachments:
  retry_max: 5
  worker_batch: 10
  max_bytes: 26214400
  allowed_mime_types: [image/jpeg, image/png, image/gif, image/webp, image/heic]

memos:
  visibility: PRIVATE
  tags: [日报, 周报, 主线, 阶段目标, 阶段总结, 年度总结]
  request_timeout_seconds: 10
  read_retries: 3
  retry_backoff_seconds: 0.5

health:
  daily_metrics: [steps, sleep, heart_rate, resting_heart_rate, active_calories, oxygen_saturation, exercise]
  weekly_metrics: [steps, sleep, resting_heart_rate, heart_rate, oxygen_saturation, active_calories, total_calories, exercise]
