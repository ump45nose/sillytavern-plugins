schema_version: 1
id: personal-crm
name: Personal CRM
command:
- personal-crm-server
public_url: https://crm-home.172906573.xyz
port: 8080
host_port: 18086
bind_address: 192.168.31.201
compose_project: personal-crm
compose_service: crm
volumes:
- name: personal-crm_crm-data
  mount: /data
  external: true
environment:
  HOST: 0.0.0.0
  PORT: '8080'
  OAUTH_STORAGE_PATH: /data/oauth
  MCP_DEVELOPMENT_NO_AUTH: 'false'
required_env:
- DATABASE_URL
- WECHAT_WEBHOOK_SECRET
- OIDC_CLIENT_SECRET
- OAUTH_JWT_SIGNING_KEY
- OAUTH_STORAGE_ENCRYPTION_KEY
- OIDC_AUTHORIZED_USERNAMES
auth:
  client_id: personal-crm
  discovery_url: https://authelia-home.172906573.xyz/.well-known/openid-configuration
backup_command:
- python
- -c
- import os,sqlite3;from sqlalchemy.engine import make_url;p=make_url(os.environ['DATABASE_URL']).database;a=sqlite3.connect(p);b=sqlite3.connect('{backup_path}');a.backup(b);b.close();a.close()
integrity_command:
- personal-crm
- integrity
plugin:
  name: personal-crm
  version: 1.1.1
  description: 管理个人联系人与人际关系：按姓名、别名、联系方式或标签查找朋友、同事、客户、HR 和猎头，查看人物档案、近期互动摘要、重要事实与待跟进事项。适用于“我上次和某人聊了什么”“最近该联系谁”“记下对方的新工作或偏好”“下周提醒我跟进”“汇总本周关系维护情况”。支持新增或更新联系人、记录互动摘要和人物事实、创建/完成/推迟/跳过提醒，以及查看每周跟进指标；写入返回修改前后信息。微信来源可读取指定日期的已同步聊天原文，不代发消息。
  display_name: Personal CRM
  app_id: asdk_app_6a9c253024d88191a19ccbd6c3d54b1d
  app_binding: dev-6a9c253024d88191a19ccbd6c3d54b1d
  logo: assets/plugin/logo.svg
  keywords:
  - CRM
  - 联系人
  - 关系管理
  - 微信摘要
  - HR
  - 猎头
  - 跟进
  - 提醒
