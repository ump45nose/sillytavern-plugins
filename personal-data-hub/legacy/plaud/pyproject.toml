[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plaud-daily"
version = "0.1.0"
description = "Local Plaud recording sync and daily transcription"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.2.0",
  "numpy==2.3.3",
  "sherpa-onnx==1.13.8",
  "PyYAML==6.0.3",
  "opencc-python-reimplemented==0.1.7",
]

[project.scripts]
recording-review = "plaud_daily.cli:main"
plaud-gold = "plaud_daily.gold:main"
plaud-diarization-trial = "plaud_daily.diarization_trial:main"
plaud-asr-trial = "plaud_daily.asr_trial:main"
plaud-evaluate-trial = "plaud_daily.evaluate_trial:main"
plaud-asr-gold-trial = "plaud_daily.asr_gold_trial:main"
plaud-fusion-v3 = "plaud_daily.fusion_v3:main"
plaud-fusion-decisive = "plaud_daily.fusion_decisive:submit_once"
plaud-daily-v3 = "plaud_daily.daily_v3:main"

[tool.setuptools.packages.find]
where = ["src"]
