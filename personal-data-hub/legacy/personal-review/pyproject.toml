[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-review"
version = "0.1.0"
description = "Hermes personal evidence, review ledger and projection pipeline"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
# 邮件采集使用独立运行环境，避免 Hermes 升级覆盖 MCP 客户端依赖。
email = ["fastmcp>=3.4,<4", "mcp>=1.24,<2"]

[project.scripts]
reviewctl = "review.cli:main"

[tool.setuptools.packages.find]
include = ["review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
