[project]
name = "personal-data-hub"
version = "0.1.0"
description = "个人信息采集、归档与统一只读查询"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "PyYAML>=6,<7", "personal-crm"]

[project.scripts]
hub = "personal_data_hub.cli:main"
personal-data-hub = "personal_data_hub.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_data_hub"]

[tool.uv.workspace]
members = ["apps/crm", "apps/usage-monitor"]

[tool.uv.sources]
personal-crm = { workspace = true }
usage-monitor-mcp = { workspace = true }
mcp-platform = { git = "https://github.com/ump45nose/mcp-platform.git", rev = "dea309a5d83b6365a57937bc6e11affe692bfcaf" }
dingtalk-events = { git = "https://github.com/ump45nose/dingtalk-workspace-plugin.git", rev = "59f91c009207528a4183e6d6db242f6ccf4117cd", subdirectory = "mmp-platform/events" }
