services:
  media-download-mcp:
    image: local/media-download-mcp:0.1.4-server-login
    user: 1000:1001
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    build:
      context: ../..
      dockerfile: apps/media-download-mcp/Dockerfile
    ports:
    - 127.0.0.1:8091:8091
    volumes:
    - ${MEDIA_DOWNLOAD_RUNTIME_DIR:-.}/config.json:/config/config.json:ro
    - ${MEDIA_DOWNLOAD_RUNTIME_DIR:-.}/secrets:/run/secrets:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    container_name: media-automation-media-download-mcp-1
