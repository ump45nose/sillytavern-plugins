[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "media-capabilities"
version = "0.3.3"
description = "Reusable media file, Emby, 115 and lossless disc preparation capabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
acquisition = ["beautifulsoup4>=4.14,<5", "fast-bencode>=1.1.8,<2", "requests>=2.32,<3"]

[project.scripts]
mini4k-login = "media_capabilities.acquisition.mini4k_login:main"

[tool.setuptools.packages.find]
where = ["src"]
