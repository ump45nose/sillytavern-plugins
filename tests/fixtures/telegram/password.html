<!doctype html><html><head><style>
/* tweb src/scss/base.scss .stealthy: 1px, opacity 0, still "visible" to Playwright */
.stealthy{left:0;margin:0;max-height:1px;max-width:1px;opacity:0;outline:none;overflow:hidden;pointer-events:none;position:absolute;top:0;z-index:-1}
</style></head><body>
<main id="auth-pages" class="whole"><div class="_pagePassword_9q"><canvas width="130" height="130" style="width:130px;height:130px;background:#888"></canvas><div class="input-field input-field-password"><input class="stealthy" tabindex="-1" aria-hidden="true" type="password"><input type="password" required name="notsearch_password" autocomplete="off" class="input-field-input"><input class="stealthy" tabindex="-1" aria-hidden="true" type="password"></div><button class="btn-primary btn-color-primary">NEXT</button></div></main>
<script>
// Like PasswordCard: Enter on the real field submits; the field is disabled while
// checking, then marked .error on rejection or the card leaves on success.
const field = document.querySelector('input[name="notsearch_password"]');
field.addEventListener("keypress", (event) => {
  field.classList.remove("error");
  if (event.key !== "Enter" || !field.value) return;
  field.disabled = true;
  setTimeout(() => {
    if (field.value === "fixture-accepted") {
      document.getElementById("auth-pages").remove();
      return;
    }
    field.disabled = false;
    field.classList.add("error");
  }, 300);
});
</script>
</body></html>
