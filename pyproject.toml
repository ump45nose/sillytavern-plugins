[project]
name = "personal-crm"
version = "0.1.2"
description = "Agent-driven personal CRM with remote MCP and a local WeChat connector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  # 认证、MCP 协议栈和兼容修正由版本化公共基座锁定。
  "mcp-platform==0.1.4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
personal-crm = "personal_crm.app.cli:main"
personal-crm-server = "personal_crm.app.server:main"
personal-crm-wechat = "personal_crm.connector.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_crm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
mcp-platform = { git = "https://github.com/ump45nose/mcp-platform.git", rev = "f9281abd5db0bf0614aa817832d2440e4b7ae57b" }
