[project]
name = "mcp-platform"
version = "0.1.1"
description = "Versioned FastMCP runtime and transactional NAS deployment tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp==3.4.4", "mcp==1.28.1", "authlib==1.7.2",
  "httpcore==1.0.9", "py-key-value-aio[disk]==0.4.6", "starlette==1.3.1",
  "httpx>=0.28,<1", "pydantic>=2.11,<3", "pydantic-settings>=2.6,<3",
  "PyYAML>=6,<7", "python-dotenv>=1,<2", "uvicorn>=0.35,<1",
]

[project.scripts]
mcpctl = "mcp_platform.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
