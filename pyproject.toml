[project]
name = "personal-crm"
version = "0.1.0"
description = "Agent-driven personal CRM with remote MCP and a local WeChat connector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  # OAuth 协议栈与已通过 ChatGPT 验收的 SmartSearch 镜像保持一致。
  "authlib==1.7.2",
  "fastapi>=0.115,<1",
  # 与已通过 ChatGPT 网页端 OAuth 验收的 SmartSearch 保持完全一致，避免认证协议实现漂移。
  "fastmcp==3.4.4",
  "httpx>=0.27,<1",
  "mcp==1.28.1",
  "python-dotenv>=1.0,<2",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "starlette==1.3.1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
personal-crm = "personal_crm.app.cli:main"
personal-crm-server = "personal_crm.app.server:main"
personal-crm-wechat = "personal_crm.connector.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_crm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
