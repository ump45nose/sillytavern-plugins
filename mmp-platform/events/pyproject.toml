[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dingtalk-events"
version = "0.1.0"
description = "Read-only DingTalk event producers for the existing MCP runtime"
requires-python = ">=3.12"
dependencies = ["mcp>=1.28,<2", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dingtalk_events"]
