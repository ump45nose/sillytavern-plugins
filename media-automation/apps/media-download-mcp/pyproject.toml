[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "media-download-mcp"
version = "0.1.4"
requires-python = ">=3.11"
dependencies = ["media-capabilities==0.3.3", "mcp==2.3.0", "uvicorn==0.54.0"]

[project.scripts]
media-download-mcp = "media_download_mcp.server:main"

[tool.setuptools.packages.find]
include = ["media_download_mcp*"]
