[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "favsync"
version = "0.1.0"
description = "Config-driven favorite media and EPUB downloader"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.1", "PySocks==1.7.1", "requests>=2.31,<3"
]

[project.optional-dependencies]
gallery = [
  "gallery-dl @ git+https://codeberg.org/mikf/gallery-dl.git@74a5aaf276df69f493ca8f68ebb478afe31a45ad"
]
xhs = [
  "xiaohongshu-cli @ git+https://github.com/jackwener/xiaohongshu-cli.git@4d63f3c0c85ccd9054fa8e96d7f761aaf2507449"
]
ocr = [
  "rapidocr==3.9.2", "onnxruntime==1.24.3", "opencv-python==4.13.0.92"
]
all = [
  "rapidocr==3.9.2", "onnxruntime==1.24.3", "opencv-python==4.13.0.92",
  "gallery-dl @ git+https://codeberg.org/mikf/gallery-dl.git@74a5aaf276df69f493ca8f68ebb478afe31a45ad",
  "xiaohongshu-cli @ git+https://github.com/jackwener/xiaohongshu-cli.git@4d63f3c0c85ccd9054fa8e96d7f761aaf2507449"
]

[project.scripts]
favsync = "favsync.cli:main"

[tool.setuptools.packages.find]
include = ["favsync*"]
