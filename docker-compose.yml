services:
  crm:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["${CRM_BIND_ADDRESS:-127.0.0.1}:${CRM_HOST_PORT:-8080}:8080"]
    volumes: ["crm-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  crm-data:
