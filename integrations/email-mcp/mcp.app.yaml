schema_version: 1
id: email-mcp
name: 邮件
command: [email-mcp-platform]
public_url: https://email-home.172906573.xyz
port: 9557
host_port: 9557
bind_address: 127.0.0.1
health_path: /healthz
mcp_path: /mcp
compose_project: mcp-platform
compose_service: email-mcp
user: '1000:1001'
working_dir: /data
init: true
external_networks: [tool_net]
volumes:
  - name: email-mcp-data
    mount: /data
    external: true
  - name: email-mcp-oauth
    mount: /oauth
    external: true
environment:
  HOST: 0.0.0.0
  PORT: '9557'
  HOME: /data
  XDG_CONFIG_HOME: /data/.config
  OAUTH_STORAGE_PATH: /oauth
  MCP_DEVELOPMENT_NO_AUTH: 'false'
  MCP_PROXY_SNI_COMPATIBILITY: 'true'
required_env:
  - OIDC_CLIENT_SECRET
  - OAUTH_JWT_SIGNING_KEY
  - OAUTH_STORAGE_ENCRYPTION_KEY
  - OIDC_AUTHORIZED_USERNAMES
auth:
  client_id: email-mcp
  discovery_url: https://authelia-home.172906573.xyz/.well-known/openid-configuration
expected_tools: [list_available_accounts, list_emails_metadata, list_mailboxes, send_email, save_draft]
plugin:
  name: email-mcp
  version: 0.1.0
  display_name: 邮件
  description: 管理已配置的邮箱：查找和阅读邮件、浏览文件夹、查看附件，并按现有邮箱权限保存草稿、发送或整理邮件。邮件收发与账号配置沿用现有服务。
  logo: assets/zoho-mail.png
  keywords: [邮件, 邮箱, IMAP, SMTP, Zoho]
